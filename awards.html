<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awards & Certification · Sumin Hong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#170B2E; --ink-soft:#241442; --paper:#F3EEFB; --paper-2:#E9DFF5; --card:#FAF7FE;
    --slate:#5B4B78; --slate-light:#8C7BA8; --violet:#8B5CF6; --violet-soft:#C4B5FD;
    --cyan:#22D3EE; --magenta:#D946EF; --line:#DDD2EF; --line-dark:#3B2564;
    --navh:52px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--navh) + 14px);}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans','IBM Plex Sans KR',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--violet-soft);color:var(--ink);}
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media (max-width:640px){.wrap{padding:0 20px;}}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet-soft);}

  /* ============ STICKY TOP NAV ============ */
  .sticky-nav{
    position:fixed;top:0;left:0;right:0;height:var(--navh);z-index:120;
    background:rgba(23,11,46,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(196,181,253,.16);
    transform:translateY(-100%);transition:transform .28s ease;
  }
  .sticky-nav.show{transform:translateY(0);}
  .sticky-inner{max-width:1080px;margin:0 auto;height:100%;padding:0 32px;display:flex;align-items:center;gap:18px;}
  @media (max-width:640px){.sticky-inner{padding:0 14px;gap:10px;}}
  .sticky-brand{
    font-family:'IBM Plex Serif',serif;font-size:15px;color:#fff;text-decoration:none;
    white-space:nowrap;flex-shrink:0;letter-spacing:-.01em;
  }
  .sticky-brand em{font-style:italic;color:var(--cyan);}
  @media (max-width:520px){.sticky-brand{display:none;}}
  .sticky-links{
    display:flex;gap:2px;align-items:center;overflow-x:auto;flex:1;
    scrollbar-width:none;-ms-overflow-style:none;height:100%;
  }
  .sticky-links::-webkit-scrollbar{display:none;}
  .sticky-links a{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.02em;color:#B9AEDD;
    text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:5px;
    transition:color .15s, background .15s;position:relative;
  }
  .sticky-links a:hover{color:#fff;background:rgba(196,181,253,.12);}
  .sticky-links a.active{color:#fff;background:rgba(139,92,246,.32);}
  .sticky-links a.active::after{
    content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--cyan);border-radius:2px;
  }
  #lang-toggle-fixed{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);background:var(--violet-soft);
    border:none;border-radius:20px;padding:5px 12px;cursor:pointer;flex-shrink:0;transition:background .15s;
  }
  #lang-toggle-fixed:hover{background:#fff;}

  /* ============ HERO ============ */
  header.hero{
    background:radial-gradient(900px 480px at 88% -10%, rgba(139,92,246,0.35), transparent 60%),
      radial-gradient(700px 420px at 8% 105%, rgba(34,211,238,0.16), transparent 65%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-soft) 100%);
    color:#EDE9F7;padding:26px 0 64px;border-bottom:1px solid var(--line-dark);position:relative;overflow:hidden;
  }
  header.hero::after{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(196,181,253,0.06) 0 1px, transparent 1px 120px),
      repeating-linear-gradient(0deg, rgba(196,181,253,0.05) 0 1px, transparent 1px 120px);
    mask-image:linear-gradient(180deg, transparent, rgba(0,0,0,.9) 30%, transparent 92%);
    pointer-events:none;
  }
  .portal{position:absolute;top:-160px;right:-120px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle, rgba(139,92,246,.55), rgba(34,211,238,.18) 55%, transparent 72%);
    filter:blur(6px);animation:pulse 7s ease-in-out infinite;pointer-events:none;}
  @keyframes pulse{0%,100%{opacity:.75;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}
  @media (prefers-reduced-motion: reduce){ .portal{animation:none;} html{scroll-behavior:auto;} }

  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;padding-top:34px;position:relative;z-index:1;}
  nav.tabs{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:flex-end;max-width:640px;}
  nav.tabs a{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;color:#B9AEDD;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:color .15s, border-color .15s;}
  nav.tabs a:hover{color:#fff;border-color:var(--cyan);}
  #lang-toggle{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--ink);background:var(--violet-soft);border:1px solid transparent;border-radius:20px;padding:6px 14px;cursor:pointer;transition:all .15s;}
  #lang-toggle:hover{background:#fff;}

  .hero-body{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:1;margin-top:34px;}
  .hero-text{flex:1;min-width:260px;}
  .hero-profile{
    width:160px;height:160px;border-radius:50%;overflow:hidden;flex-shrink:0;
    border:2px solid rgba(196,181,253,.35);
    box-shadow:0 12px 40px rgba(139,92,246,.35), 0 0 0 6px rgba(139,92,246,.08);
    background:var(--ink-soft);position:relative;z-index:1;
  }
  .hero-profile img{width:100%;height:100%;object-fit:cover;display:block;}
  @media (max-width:640px){ .hero-body{gap:24px;} .hero-profile{width:120px;height:120px;} }

  .hero-name{font-family:'IBM Plex Serif',serif;font-weight:500;font-size:clamp(40px, 6vw, 68px);line-height:1.05;margin:0 0 6px;letter-spacing:-.01em;}
  .hero-name em{font-style:italic;color:var(--cyan);font-weight:400;}
  .hero-kr{font-family:'IBM Plex Sans KR',sans-serif;color:#A79BC9;font-size:15px;margin-bottom:26px;}
  .hero-role{font-size:17px;color:#DCD5F0;max-width:640px;margin-bottom:8px;}
  .hero-role strong{color:#fff;font-weight:600;}
  .hero-sub{color:#A79BC9;font-size:14.5px;max-width:640px;}
  .status-line{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .status-chip{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:5px 10px;border-radius:3px;border:1px solid rgba(196,181,253,.28);color:#DCD5F0;display:inline-flex;align-items:center;gap:6px;}
  .status-chip .dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .status-chip .dot.violet{background:var(--violet-soft);box-shadow:0 0 8px var(--violet-soft);}
  .status-chip .dot.cyan{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .hero-links{margin-top:22px;display:flex;gap:18px;flex-wrap:wrap;}
  .hero-links a{font-size:13px;text-decoration:none;color:#B9AEDD;border-bottom:1px solid rgba(196,181,253,.3);padding-bottom:2px;transition:color .15s,border-color .15s;}
  .hero-links a:hover{color:#fff;border-color:var(--cyan);}

  /* ============ SECTIONS ============ */
  section{padding:64px 0;position:relative;}
  section + section{border-top:1px solid var(--line);}
  section:nth-of-type(even){background:linear-gradient(180deg, rgba(250,247,254,.7), rgba(250,247,254,0));}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:30px;flex-wrap:wrap;position:relative;padding-top:14px;}
  .sec-head::before{
    content:"";position:absolute;top:0;left:0;width:40px;height:3px;border-radius:2px;
    background:linear-gradient(90deg, var(--violet), var(--cyan));
  }
  .sec-title{font-family:'IBM Plex Serif',serif;font-size:28px;font-weight:500;letter-spacing:-.01em;}
  .sec-note{color:var(--slate-light);font-size:13.5px;}
  .sub-head{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin:34px 0 14px;display:block;}
  .sub-head:first-child{margin-top:0;}

  .about-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:48px;}
  @media (max-width:800px){.about-grid{grid-template-columns:1fr;}}
  .about-lead{font-size:18px;color:var(--ink-soft);max-width:56ch;}
  .about-lead strong{color:var(--ink);}
  .interest-box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-top:22px;}
  .interest-box .eyebrow{margin-bottom:10px;display:block;color:var(--violet);}
  .interest-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .interest-tags span{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--slate);}
  .about-facts{border-left:1px solid var(--line);padding-left:32px;}
  @media (max-width:800px){.about-facts{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:28px;}}
  .fact{margin-bottom:20px;}
  .fact .k{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-light);}
  .fact .v{font-size:15px;margin-top:3px;}

  /* Education cards */
  .edu-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px,1fr));gap:16px;}
  .edu-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;position:relative;overflow:hidden;transition:transform .18s, box-shadow .18s;}
  .edu-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(139,92,246,.12);}
  .edu-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--violet-soft);}
  .edu-card[data-kind="degree"]::before{background:linear-gradient(180deg,var(--violet),var(--magenta));}
  .edu-card[data-kind="visiting"]::before{background:linear-gradient(180deg,var(--cyan),var(--violet-soft));}
  .edu-card .edu-top{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
  .edu-logo{width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--line);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .edu-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
  .edu-card .edu-date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--violet);}
  .edu-card h4{margin:0 0 3px;font-size:16px;font-weight:600;font-family:'IBM Plex Serif',serif;}
  .edu-card .edu-school{font-size:13.5px;color:var(--slate);}
  .edu-card .edu-detail{font-size:12.5px;color:var(--slate-light);margin-top:8px;line-height:1.55;}

  /* Ledger */
  .ledger{border-top:1px solid var(--line);}
  .ledger-row{display:grid;grid-template-columns:36px 130px 1fr auto;gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);}
  .ledger-row.no-logo{grid-template-columns:130px 1fr auto;}
  @media (max-width:700px){.ledger-row, .ledger-row.no-logo{grid-template-columns:1fr;gap:6px;}}
  .ledger-logo{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .ledger-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
  @media (max-width:700px){.ledger-logo{width:28px;height:28px;}}
  .ledger-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate-light);padding-top:3px;}
  .ledger-main .title{font-size:15.5px;font-weight:500;color:var(--ink);}
  .ledger-main .org{font-size:13.5px;color:var(--slate);margin-top:2px;}
  .ledger-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.02em;padding:3px 8px;border-radius:3px;white-space:nowrap;}
  .pill.done{background:#EFE8FC;color:#6D28D9;border:1px solid #DACCF5;}
  .pill.progress{background:#FCE7F8;color:#A21CAF;border:1px solid #F3C6EC;}
  .pill.planned{background:#E0F7FB;color:#0E7490;border:1px solid #B6E9F3;}
  .pill.role{background:#EFEBFA;color:var(--slate);border:1px solid var(--line);}
  .filter-bar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .filter-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--slate);cursor:pointer;transition:all .15s;}
  .filter-btn:hover{border-color:var(--violet-soft);}
  .filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .ledger-row.hidden{display:none;}
  .count-note{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate-light);margin-bottom:16px;}

  /* Publications */
  .pub-list{border-top:1px solid var(--line);}
  .pub{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:56px 1fr;gap:18px;}
  @media (max-width:640px){.pub{grid-template-columns:1fr;gap:4px;}}
  .pub .yr{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--violet);padding-top:2px;}
  .pub .cite{font-size:14.5px;color:var(--ink-soft);}
  .pub .journal{font-style:italic;color:var(--slate);}
  .pub .doi{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet-soft);margin-left:6px;white-space:nowrap;}

  .plain-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);}
  .plain-list li{padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-list a, .chip-list span{font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--slate);text-decoration:none;transition:all .15s;}
  .chip-list a:hover{border-color:var(--violet);color:var(--violet);}

  .collapse-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:#fff;color:var(--violet);
    border:1px solid var(--line);border-radius:20px;padding:8px 18px;cursor:pointer;margin-top:18px;transition:all .15s;
  }
  .collapse-btn:hover{border-color:var(--violet);background:var(--card);}

  .flagship-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:12px;}
  @media (max-width:900px){.flagship-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:640px){.flagship-grid{grid-template-columns:1fr;}}
  .flagship{background:var(--ink);color:#EDE9F7;border-radius:8px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .flagship-inner{padding:26px 26px 22px;position:relative;flex:1;}
  .flagship-inner::before{content:"";position:absolute;top:0;right:0;width:130px;height:130px;background:radial-gradient(circle at top right, rgba(139,92,246,.45), transparent 70%);pointer-events:none;}
  .flagship-inner::after{content:"";position:absolute;bottom:-40px;left:-30px;width:110px;height:110px;background:radial-gradient(circle, rgba(34,211,238,.25), transparent 70%);pointer-events:none;}
  .flagship-image{width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--ink-soft);position:relative;}
  .flagship-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .flagship-image::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, transparent 60%, rgba(23,11,46,.55));pointer-events:none;}
  .flagship .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cyan);letter-spacing:.06em;position:relative;z-index:1;}
  .flagship h4{font-family:'IBM Plex Serif',serif;font-size:20px;margin:8px 0 8px;font-weight:500;position:relative;z-index:1;}
  .flagship p{font-size:13.5px;color:#C6BCE3;margin:0 0 14px;position:relative;z-index:1;}
  .flagship a{font-size:12.5px;color:#fff;text-decoration:none;border-bottom:1px solid var(--cyan);position:relative;z-index:1;}

  /* Books */
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px,1fr));gap:16px;}
  .book-card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s, box-shadow .18s;}
  .book-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(139,92,246,.14);}
  .book-cover{width:100%;aspect-ratio:3/4;background:linear-gradient(150deg,var(--ink),var(--ink-soft));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .book-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .book-cover .ph{font-family:'IBM Plex Serif',serif;font-size:34px;color:rgba(196,181,253,.4);}
  .book-body{padding:14px 16px 16px;flex:1;}
  .book-body .b-title{font-size:14px;font-weight:500;line-height:1.45;}
  .book-body .b-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate-light);margin-top:6px;}

  /* Teaching */
  .teach-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  @media (max-width:800px){.teach-grid{grid-template-columns:1fr;}}
  .teach-col h4{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-light);margin-bottom:16px;}
  .teach-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start;}
  .teach-item.no-thumb{display:block;}
  .teach-thumb{width:72px;height:54px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--paper-2);border:1px solid var(--line);}
  .teach-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .teach-body{flex:1;min-width:0;}
  .teach-item .t-title{font-size:14.5px;color:var(--ink);font-weight:500;}
  .teach-item .t-meta{font-size:12.5px;color:var(--slate-light);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .lec-row{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start;}
  @media (max-width:640px){.lec-row{grid-template-columns:1fr;gap:2px;}}
  .lec-row .lec-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--violet);padding-top:2px;}
  .lec-row .lec-org{font-size:13px;color:var(--slate);font-weight:500;}
  .lec-row .lec-title{font-size:14px;color:var(--ink-soft);margin-top:1px;}
  .lec-row a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet-soft);}
  .lec-row.hidden{display:none;}

  .special-strip{display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:12px;margin-top:20px;}
  .special-strip figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .special-strip img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;cursor:zoom-in;}
  .special-strip figcaption{font-size:12px;color:var(--slate);padding:8px 10px;border-top:1px solid var(--line);}

  /* Awards / coursework */
  .group-block{margin-bottom:34px;}
  .award-row{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);}
  @media (max-width:640px){.award-row{grid-template-columns:1fr;gap:2px;}}
  .award-row .a-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--violet);}
  .award-row .a-title{font-size:14px;color:var(--ink-soft);}
  .cw-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:10px;}
  .cw-card .c-title{font-size:14.5px;font-weight:500;}
  .cw-card .c-inst{font-size:12.5px;color:var(--slate);margin-top:3px;}
  .cw-card .c-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate-light);margin-top:4px;}
  .group-note{font-size:13px;color:var(--slate-light);margin:-6px 0 14px;font-style:italic;}

  /* Data science */
  .ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:800px){.ds-grid{grid-template-columns:1fr;}}
  .ds-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 24px;}
  .ds-card h4{margin:0 0 10px;font-size:16px;font-family:'IBM Plex Serif',serif;font-weight:600;line-height:1.4;}
  .ds-card p{font-size:13.5px;color:var(--slate);margin:0 0 14px;line-height:1.65;}

  if(!d.books) d.books = {sectionTitle:{en:'Books',ko:'저서'}, sectionNote:{en:'',ko:''}, items:[]};
  if(!Array.isArray(d.books.items)) d.books.items = [];
  d.books.items.forEach(b => { if(typeof b.image !== 'string') b.image = ''; });

  if(!d.teaching) d.teaching = {};
  ['courseLectures','invitedTalks','specialLectures','specialLectureGallery','topics'].forEach(k=>{
    if(!Array.isArray(d.teaching[k])) d.teaching[k] = [];

  if(!d.gallery) d.gallery = {sectionTitle:{en:'Gallery',ko:'갤러리'}, sectionNote:{en:'',ko:''}, items:[]};

  if(!d.contact) d.contact = {};

}

function tr(field){
  if(field == null) return '';
  if(typeof field === 'string') return field;
  return field[LANG] ?? field.en ?? '';
}
function escapeAttr(s){ return (s+'').replace(/"/g,'&quot;'); }

/* ---------- section visibility helper ---------- */
function setSectionVisible(id, visible){
  const el = document.getElementById(id);
  if(el) el.style.display = visible ? '' : 'none';
}

/* ============================================================
   FILTERS
   ============================================================ */
function updateProjectCount(){
  const rows = document.querySelectorAll('#project-ledger .ledger-row');
  const shown = document.querySelectorAll('#project-ledger .ledger-row:not(.hidden)').length;
  document.getElementById('project-count').textContent =
    LANG === 'ko' ? `${shown} / ${rows.length}건 표시` : `Showing ${shown} of ${rows.length}`;
}
function bindFilters(){
  const buttons = document.querySelectorAll('.filter-btn');
  const rows = document.querySelectorAll('#project-ledger .ledger-row');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      rows.forEach(r=>{
        if(f === 'all'){ r.classList.remove('hidden'); return; }
        const match = r.dataset.role === f || r.dataset.status === f || r.dataset.cat === f;
        r.classList.toggle('hidden', !match);
      });
      updateProjectCount();
    });
  });
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function bindLightbox(){
  document.querySelectorAll('[data-lightbox]').forEach(el=>{
    if(el.dataset.lbBound) return;
    el.dataset.lbBound = '1';
    el.addEventListener('click', ()=>{
      document.getElementById('lb-img').src = el.dataset.lightbox;
      document.getElementById('lb-img').alt = el.dataset.caption || '';
      document.getElementById('lb-caption').textContent = el.dataset.caption || '';
      document.getElementById('lightbox').classList.add('open');
    });
  });
}
document.getElementById('lightbox').addEventListener('click', (e)=>{
  if(e.target.id === 'lightbox' || e.target.id === 'lb-close'){
    document.getElementById('lightbox').classList.remove('open');
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

/* ============================================================
   STICKY NAV + SCROLL SPY
   ============================================================ */
function initScrollSpy(){
  const nav = document.getElementById('sticky-nav');
  const toTop = document.getElementById('to-top');
  const links = Array.from(document.querySelectorAll('#sticky-links a'));
  const sections = links
    .map(a => a.dataset.target ? __getEl(a.dataset.target) : null)
    .filter(Boolean);

  function onScroll(){
    const y = window.scrollY || document.documentElement.scrollTop;
    const heroH = document.querySelector('header.hero').offsetHeight;
    nav.classList.toggle('show', y > heroH - 80);
    toTop.classList.toggle('show', y > heroH);

    const line = y + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--navh')) + 40;
    let current = null;
    sections.forEach(s=>{ if(s.offsetTop <= line) current = s.id; });
    if(!current && sections.length) current = sections[0].id;
    if(sections.length) links.forEach(a=> a.classList.toggle('active', a.dataset.target === current));

    // keep active chip in view on narrow screens
    const activeEl = document.querySelector('#sticky-links a.active');
    if(activeEl && nav.classList.contains('show')){
      const box = document.getElementById('sticky-links');
      const l = activeEl.offsetLeft, r = l + activeEl.offsetWidth;
      if(l < box.scrollLeft || r > box.scrollLeft + box.clientWidth){
        box.scrollTo({left: l - box.clientWidth/2 + activeEl.offsetWidth/2, behavior:'smooth'});
      }
    }
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  onScroll();
}

document.getElementById('to-top').addEventListener('click', ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
});

document.addEventListener('click', (e)=>{
  const t = e.target;
  if(t && (t.id === 'lang-toggle' || t.id === 'lang-toggle-fixed')){
    LANG = LANG === 'en' ? 'ko' : 'en';
    try{ localStorage.setItem('sh-lang', LANG); }catch(e){}
    render();
    initScrollSpy();
  }
  if(t && t.id === 'special-toggle'){
    SPECIAL_OPEN = !SPECIAL_OPEN;
    render();
    if(!SPECIAL_OPEN){
      document.getElementById('teaching').scrollIntoView({behavior:'smooth', block:'start'});
    }
  }
});

loadData();

/* back-to-home label follows the language */
const __bl = __getEl('back-label');
if(__bl){ const paint = ()=>{ __bl.textContent = (LANG === 'ko') ? '\uba54\uc778\uc73c\ub85c' : 'Back to home'; };
  paint(); document.addEventListener('click', ()=>setTimeout(paint,0)); }

</script>
